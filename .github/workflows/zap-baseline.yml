name: "OWASP ZAP Baseline Scan"

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:
    inputs:
      target_url:
        description: "Target URL to scan (overrides repository variable ZAP_TARGET_URL)"
        required: false
        default: ""

jobs:
  zap-baseline:
    if: ${{ (github.event.inputs.target_url || vars.ZAP_TARGET_URL) != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set ZAP target URL
        run: echo "ZAP_TARGET_URL=${{ github.event.inputs.target_url || vars.ZAP_TARGET_URL }}" >> "$GITHUB_ENV"

      - name: Run OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: ${{ env.ZAP_TARGET_URL }}
          cmd_options: "-a"

      - name: Upload ZAP reports
        uses: actions/upload-artifact@v6
        with:
          name: zap-baseline-report
          path: |
            zap-report.html
            zap-report.json
            zap-report.md
